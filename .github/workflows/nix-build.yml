name: "Build & cache"

on:
  push:
    branches: [main]
  workflow_dispatch:

# Queue every build run rather than canceling an older pending run.
concurrency:
  group: nix-system-build
  queue: max
  cancel-in-progress: false

jobs:
  warm-anki-seara:
    name: Cache Anki Seara addon
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_PAT }}
          submodules: recursive
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@main

      - name: Setup Xilo cache
        uses: stubbedev/xilo@v1.2.8
        with:
          url: https://nixos-cache.warp-racing.com
          token: ${{ secrets.XILO_PUSH_TOKEN }}
          cache: admin/skifli-nixos

      - name: Configure private Xilo pull credentials
        env:
          XILO_SERNIX_PULL_TOKEN: ${{ secrets.XILO_SERNIX_PULL_TOKEN }}
          XILO_ORACLE_PULL_TOKEN: ${{ secrets.XILO_ORACLE_PULL_TOKEN }}
        run: |
          umask 077
          cat > "$RUNNER_TEMP/xilo.netrc" <<EOF
          machine sernix-cache.warp-racing.com
            login xilo
            password ${XILO_SERNIX_PULL_TOKEN}
          machine oracle-cache.warp-racing.com
            login xilo
            password ${XILO_ORACLE_PULL_TOKEN}
          EOF
          install -m 0600 "$RUNNER_TEMP/xilo.netrc" "$HOME/.netrc"
          echo "netrc-file = $HOME/.netrc" | sudo tee -a /etc/nix/nix.conf >/dev/null
          printf 'NIX_CONFIG=netrc-file = %s/.netrc\n' "$HOME" >> "$GITHUB_ENV"
          sudo systemctl restart nix-daemon.service
          export NIX_CONFIG="netrc-file = $HOME/.netrc"
          nix show-config | grep -F "netrc-file = $HOME/.netrc"
          rm -f "$RUNNER_TEMP/xilo.netrc"

      - name: Build and cache x86_64 Anki Seara addon
        run: |
          SEARA_PATH=""
          for attempt in 1 2 3 4; do
            if SEARA_PATH=$(nix build \
              --accept-flake-config \
              --impure \
              --option download-attempts 10 \
              --no-link \
              --print-out-paths \
              --expr '(builtins.getFlake (toString ./.)).inputs.anki-seara.packages."x86_64-linux".default'); then
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "Anki Seara build failed after ${attempt} attempts."
              exit 1
            fi
            delay=$((15 * (2 ** (attempt - 1))))
            echo "Anki Seara build failed (attempt ${attempt}/4); retrying in ${delay}s."
            sleep "$delay"
          done
          nix-store -qR "$SEARA_PATH" | xilo push admin/skifli-nixos -

  build:
    name: Build (${{ matrix.host }})
    needs: warm-anki-seara
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: lyra
            runner: ubuntu-latest
          - host: fydetabduo
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_PAT }}
          submodules: recursive
          fetch-depth: 0

      - name: Set up Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Setup nothing-but-nix
        uses: wimpysworld/nothing-but-nix@main

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@main

      - name: Setup Xilo cache # For anyone as it also sets up the pull token
        uses: stubbedev/xilo@v1.2.8
        with:
          url: https://nixos-cache.warp-racing.com
          token: ${{ secrets.XILO_PUSH_TOKEN }}
          cache: admin/skifli-nixos

      - name: Configure private Xilo pull credentials
        env:
          XILO_SERNIX_PULL_TOKEN: ${{ secrets.XILO_SERNIX_PULL_TOKEN }}
          XILO_ORACLE_PULL_TOKEN: ${{ secrets.XILO_ORACLE_PULL_TOKEN }}
        run: |
          umask 077
          cat > "$RUNNER_TEMP/xilo.netrc" <<EOF
          machine sernix-cache.warp-racing.com
            login xilo
            password ${XILO_SERNIX_PULL_TOKEN}
          machine oracle-cache.warp-racing.com
            login xilo
            password ${XILO_ORACLE_PULL_TOKEN}
          EOF
          install -m 0600 "$RUNNER_TEMP/xilo.netrc" "$HOME/.netrc"
          echo "netrc-file = $HOME/.netrc" | sudo tee -a /etc/nix/nix.conf >/dev/null
          printf 'NIX_CONFIG=netrc-file = %s/.netrc\n' "$HOME" >> "$GITHUB_ENV"
          sudo systemctl restart nix-daemon.service
          export NIX_CONFIG="netrc-file = $HOME/.netrc"
          nix show-config | grep -F "netrc-file = $HOME/.netrc"
          rm -f "$RUNNER_TEMP/xilo.netrc"

      - name: Build NixOS system (${{ matrix.host }})
        run: |
          LIGHT_PATH=""
          for attempt in 1 2 3 4; do
            if LIGHT_PATH=$(nix build ".?submodules=1#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel" \
              --accept-flake-config \
              --option download-attempts 10 \
              --no-link \
              --print-out-paths); then
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "NixOS build failed after ${attempt} attempts."
              exit 1
            fi
            delay=$((15 * (2 ** (attempt - 1))))
            echo "NixOS build failed (attempt ${attempt}/4); retrying in ${delay}s."
            sleep "$delay"
          done

          echo "LIGHT_PATH=$LIGHT_PATH" >> "$GITHUB_ENV"

          if [ -d "$LIGHT_PATH/specialisation/dark" ]; then
            DARK_PATH=$(readlink -f "$LIGHT_PATH/specialisation/dark")
            echo "DARK_PATH=$DARK_PATH" >> "$GITHUB_ENV"
          fi

      - name: Push builds to Xilo
        if: github.ref == 'refs/heads/main'
        run: |
          PATHS_TO_PUSH=("$LIGHT_PATH")
          if [ -n "${DARK_PATH:-}" ]; then
            PATHS_TO_PUSH+=("$DARK_PATH")
          fi

          # A brief tunnel/Cloudflare interruption can fail an otherwise-good
          # upload. Xilo skips paths and chunks already present, so retrying the
          # full closure resumes the upload without rebuilding it.
          for attempt in 1 2 3 4 5; do
            if nix-store -qR "${PATHS_TO_PUSH[@]}" | xilo push admin/skifli-nixos -; then
              exit 0
            fi

            if [ "$attempt" -eq 5 ]; then
              echo "Xilo upload failed after $attempt attempts."
              exit 1
            fi

            delay=$((5 * (2 ** (attempt - 1))))
            echo "Xilo upload failed (attempt $attempt/5); retrying in ${delay}s."
            sleep "$delay"
          done
