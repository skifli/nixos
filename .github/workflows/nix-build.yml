name: "Build & cache"

on:
  push:
    branches: [main]
  workflow_dispatch:

# Keep one run active and the newest run waiting; newer pending builds replace
# older pending builds because the newest config includes all earlier changes.
concurrency:
  group: nix-system-build
  queue: single
  cancel-in-progress: false

jobs:
  warm-anki-seara:
    name: Cache Anki Seara addon
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_PAT }}
          submodules: recursive
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@main

      - name: Setup Xilo cache
        uses: stubbedev/xilo@v1.2.8
        with:
          url: https://nixos-cache.warp-racing.com
          token: ${{ secrets.XILO_PUSH_TOKEN }}
          cache: admin/skifli-nixos

      - name: Configure private Xilo pull credentials
        env:
          XILO_SERNIX_PULL_TOKEN: ${{ secrets.XILO_SERNIX_PULL_TOKEN }}
          XILO_ORACLE_PULL_TOKEN: ${{ secrets.XILO_ORACLE_PULL_TOKEN }}
          XILO_NIXOS_PULL_TOKEN: ${{ secrets.XILO_NIXOS_PULL_TOKEN }}
        run: |
          umask 077
          cat > "$RUNNER_TEMP/xilo.netrc" <<EOF
          machine sernix-cache.warp-racing.com
            login xilo
            password ${XILO_SERNIX_PULL_TOKEN}
          machine oracle-cache.warp-racing.com
            login xilo
            password ${XILO_ORACLE_PULL_TOKEN}
          machine nixos-cache.warp-racing.com
            login xilo
            password ${XILO_NIXOS_PULL_TOKEN}
          EOF
          install -m 0600 "$RUNNER_TEMP/xilo.netrc" "$HOME/.netrc"
          echo "netrc-file = $HOME/.netrc" | sudo tee -a /etc/nix/nix.conf >/dev/null
          printf 'NIX_CONFIG=netrc-file = %s/.netrc\n' "$HOME" >> "$GITHUB_ENV"
          sudo systemctl restart nix-daemon.service
          export NIX_CONFIG="netrc-file = $HOME/.netrc"
          nix show-config | grep -F "netrc-file = $HOME/.netrc"
          rm -f "$RUNNER_TEMP/xilo.netrc"

      - name: Build and cache x86_64 Anki Seara addon
        run: |
          ./.github/scripts/build-with-xilo-watch.sh admin/skifli-nixos \
            nix build \
            --accept-flake-config \
            --impure \
            --option download-attempts 20 \
            --option max-substitution-jobs 8 \
            --no-link \
            --print-out-paths \
            --expr '(builtins.getFlake (toString ./.)).inputs.anki-seara.packages."x86_64-linux".default'

  build:
    name: Build (${{ matrix.host }})
    needs: warm-anki-seara
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: lyra
            runner: ubuntu-latest
          - host: fydetabduo
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_PAT }}
          submodules: recursive
          fetch-depth: 0

      - name: Set up Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Setup nothing-but-nix
        uses: wimpysworld/nothing-but-nix@main

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@main

      - name: Setup Xilo cache # For anyone as it also sets up the pull token
        uses: stubbedev/xilo@v1.2.8
        with:
          url: https://nixos-cache.warp-racing.com
          token: ${{ secrets.XILO_PUSH_TOKEN }}
          cache: admin/skifli-nixos

      - name: Configure private Xilo pull credentials
        env:
          XILO_SERNIX_PULL_TOKEN: ${{ secrets.XILO_SERNIX_PULL_TOKEN }}
          XILO_ORACLE_PULL_TOKEN: ${{ secrets.XILO_ORACLE_PULL_TOKEN }}
          XILO_NIXOS_PULL_TOKEN: ${{ secrets.XILO_NIXOS_PULL_TOKEN }}
        run: |
          umask 077
          cat > "$RUNNER_TEMP/xilo.netrc" <<EOF
          machine sernix-cache.warp-racing.com
            login xilo
            password ${XILO_SERNIX_PULL_TOKEN}
          machine oracle-cache.warp-racing.com
            login xilo
            password ${XILO_ORACLE_PULL_TOKEN}
          machine nixos-cache.warp-racing.com
            login xilo
            password ${XILO_NIXOS_PULL_TOKEN}
          EOF
          install -m 0600 "$RUNNER_TEMP/xilo.netrc" "$HOME/.netrc"
          echo "netrc-file = $HOME/.netrc" | sudo tee -a /etc/nix/nix.conf >/dev/null
          printf 'NIX_CONFIG=netrc-file = %s/.netrc\n' "$HOME" >> "$GITHUB_ENV"
          sudo systemctl restart nix-daemon.service
          export NIX_CONFIG="netrc-file = $HOME/.netrc"
          nix show-config | grep -F "netrc-file = $HOME/.netrc"
          rm -f "$RUNNER_TEMP/xilo.netrc"

      - name: Build and incrementally cache NixOS system (${{ matrix.host }})
        run: |
          ./.github/scripts/build-with-xilo-watch.sh admin/skifli-nixos \
            nix build ".?submodules=1#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel" \
            --accept-flake-config \
            --option download-attempts 20 \
            --option max-substitution-jobs 8 \
            --no-link \
            --print-out-paths
