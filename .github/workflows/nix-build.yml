name: "Build & cache"

on:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.host }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: lyra
          - host: fydetab
          # - host: pifi

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_PAT }}
          submodules: recursive
          fetch-depth: 0

      - name: Set up Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - uses: wimpysworld/nothing-but-nix@main

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@main
        with:
          extra-conf: |
            max-jobs = 1
            cores = 2

      - name: Detect target system
        id: system
        run: |
          SYSTEM=$(nix eval ".?submodules=1#nixosConfigurations.${{ matrix.host }}.config.nixpkgs.hostPlatform.system" --raw)
          IS_AARCH64=$( [ "$SYSTEM" = "aarch64-linux" ] && echo "true" || echo "false" )
          echo "system=$SYSTEM" >> "$GITHUB_OUTPUT"
          echo "is_aarch64=$IS_AARCH64" >> "$GITHUB_OUTPUT"
          echo "Target system: $SYSTEM (aarch64: $IS_AARCH64)"

      - name: Set up QEMU
        if: steps.system.outputs.is_aarch64 == 'true'
        run: |
          while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do
            echo "Waiting for dpkg lock..."
            sleep 5
          done

          sudo apt-get update && sudo apt-get install -y qemu-user-static binfmt-support
          sudo update-binfmts --enable qemu-aarch64
          echo "extra-platforms = aarch64-linux" | sudo tee -a /etc/nix/nix.conf
          sudo systemctl restart nix-daemon

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: "skifli-nixos"
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build NixOS system (${{ matrix.host }})
        run: |
          LIGHT_PATH=$(nix build ".?submodules=1#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel" \
            --accept-flake-config \
            --max-jobs 1 \
            --no-link \
            --print-out-paths)

          DARK_PATH=$(readlink -f "$LIGHT_PATH/specialisation/dark")

          echo "LIGHT_PATH=$LIGHT_PATH" >> "$GITHUB_ENV"
          echo "DARK_PATH=$DARK_PATH" >> "$GITHUB_ENV"

      - name: Pin builds on Cachix
        if: github.ref == 'refs/heads/main'
        run: |
          # Push both closures to ensure they are on Cachix
          cachix push skifli-nixos "$LIGHT_PATH" "$DARK_PATH"

          # Pin both to 2 latest revisions
          cachix pin skifli-nixos "${{ matrix.host }}-light" "$LIGHT_PATH" --keep-revisions 2
          cachix pin skifli-nixos "${{ matrix.host }}-dark" "$DARK_PATH" --keep-revisions 2
