name: "Build & cache"

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Report what a Cachix cleanup would delete"
        type: boolean
        default: true

env:
  CACHIX_PUSH_FILTER: "(-base-prefix-[123]$|Affinity-20x64\\.exe$|-affinity-extracted-sources$)"

jobs:
  warm-anki-seara:
    name: Cache Anki Seara addon
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_PAT }}
          submodules: recursive
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@main

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: "skifli-nixos"
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          pushFilter: "${{ env.CACHIX_PUSH_FILTER }}"

      - name: Build and cache x86_64 Anki Seara addon
        run: |
          SEARA_PATH=$(nix build \
            --accept-flake-config \
            --impure \
            --no-link \
            --print-out-paths \
            --expr '(builtins.getFlake (toString ./.)).inputs.anki-seara.packages."x86_64-linux".default')
          cachix push skifli-nixos "$SEARA_PATH"

  build:
    name: Build (${{ matrix.host }})
    needs: warm-anki-seara
    runs-on: ${{ matrix.runner }}
    env:
      CACHIX_PUSH_FILTER: "(-base-prefix-[123]$|Affinity-20x64\\.exe$|-affinity-extracted-sources$)"
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: lyra
            runner: ubuntu-latest # Intel x86_64 runner
          - host: fydetabduo
            runner: ubuntu-24.04-arm # Native ARM64 runner
          # - host: pifi
          #   runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_PAT }}
          submodules: recursive
          fetch-depth: 0

      - name: Set up Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - uses: wimpysworld/nothing-but-nix@main

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@main

      - name: Detect target system
        id: system
        run: |
          SYSTEM=$(nix eval ".?submodules=1#nixosConfigurations.${{ matrix.host }}.config.nixpkgs.hostPlatform.system" --raw)
          IS_AARCH64=$( [ "$SYSTEM" = "aarch64-linux" ] && echo "true" || echo "false" )
          echo "system=$SYSTEM" >> "$GITHUB_OUTPUT"
          echo "is_aarch64=$IS_AARCH64" >> "$GITHUB_OUTPUT"
          echo "Target system: $SYSTEM (aarch64: $IS_AARCH64)"

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: "skifli-nixos"
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          pushFilter: "${{ env.CACHIX_PUSH_FILTER }}"

      - name: Build NixOS system (${{ matrix.host }})
        run: |
          EXTRA_PLATFORMS=""
          if [ "${{ steps.system.outputs.is_aarch64 }}" = "true" ]; then
            EXTRA_PLATFORMS="--option extra-platforms aarch64-linux"
          fi

          LIGHT_PATH=$(nix build ".?submodules=1#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel" \
            --accept-flake-config \
            --no-link \
            --print-out-paths \
            $EXTRA_PLATFORMS)

          echo "LIGHT_PATH=$LIGHT_PATH" >> "$GITHUB_ENV"

          if [ -d "$LIGHT_PATH/specialisation/dark" ]; then
            DARK_PATH=$(readlink -f "$LIGHT_PATH/specialisation/dark")
            echo "DARK_PATH=$DARK_PATH" >> "$GITHUB_ENV"
          fi

      - name: Push and pin builds on Cachix
        if: github.ref == 'refs/heads/main'
        run: |
          PATHS_TO_PUSH="$LIGHT_PATH"
          if [ -n "${DARK_PATH:-}" ]; then
            PATHS_TO_PUSH="$PATHS_TO_PUSH $DARK_PATH"
          fi

          nix-store -qR $PATHS_TO_PUSH \
            | grep -v -E "$CACHIX_PUSH_FILTER" \
            | cachix push skifli-nixos

          cachix pin skifli-nixos "${{ matrix.host }}-light" "$LIGHT_PATH" --keep-revisions 2
          if [ -n "${DARK_PATH:-}" ]; then
            cachix pin skifli-nixos "${{ matrix.host }}-dark" "$DARK_PATH" --keep-revisions 2
          fi

  clean-cachix:
    name: Clean Cachix (keep only pinned closures)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    env:
      CACHIX_AUTH_TOKEN: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      DRY_RUN: "${{ inputs.dry-run }}"
    steps:
      - name: Trim Cachix to closures of current pins
        shell: bash
        run: |
          set -euo pipefail
          API="https://app.cachix.org/api/v1/cache/skifli-nixos"
          AUTH="Authorization: Bearer $CACHIX_AUTH_TOKEN"

          if [ "${DRY_RUN:-true}" = "true" ]; then
            echo "# DRY RUN: reporting only"
          fi

          echo "## Current pins:"
          PINS=$(curl -fsSL -H "$AUTH" "$API/pin")
          echo "$PINS" | jq -r '.[] | "\(.name) -> \(.lastRevision.storePath)"'

          # 1. Collect pinned store paths (the keep set roots)
          echo "$PINS" | jq -r '.[].lastRevision.storePath' > /tmp/roots.txt

          # 2. Walk closures of each pinned root using narinfo references
          : > /tmp/seen.txt
          : > /tmp/keep.txt
          cp /tmp/roots.txt /tmp/queue.txt
          HEAD=1
          while true; do
            storePath=$(sed -n "${HEAD}p" /tmp/queue.txt)
            [ -n "$storePath" ] || break
            HEAD=$((HEAD + 1))

            hash=$(basename "$storePath" | cut -d- -f1)
            if grep -qxF "$hash" /tmp/seen.txt 2>/dev/null; then
              continue
            fi
            echo "$hash" >> /tmp/seen.txt
            echo "$hash" >> /tmp/keep.txt

            # Cachix serves standard Nix narinfo files from its binary cache.
            # References are the full store basenames, so turn them back into paths.
            narinfo=$(curl -fsSL "https://skifli-nixos.cachix.org/$hash.narinfo" || true)
            references=$(printf '%s\n' "$narinfo" | sed -n 's/^References: //p')
            if [ -n "$references" ]; then
              while read -r reference; do
                [ -n "$reference" ] && printf '/nix/store/%s\n' "$reference" >> /tmp/queue.txt
              done <<< "$references"
            fi
          done

          sort -u /tmp/keep.txt -o /tmp/keep.txt
          KEEP_COUNT=$(wc -l < /tmp/keep.txt)

          # Just in case - as the closure of two NixOS systems is hundreds of paths. If
          # the keep-set is extremely small the narinfo parse probs has failed -
          # abort rather than delete the cache.
          if [ "$KEEP_COUNT" -lt 50 ]; then
            echo "## Aborting: keep-set only $KEEP_COUNT paths (<50) - refusing to delete cache" >&2
            exit 1
          fi
          echo "## Keep-set: $KEEP_COUNT store paths"

          # 3. List everything in the cache
          curl -fsSL -H "$AUTH" "$API/contents" | jq -r '.[]' > /tmp/contents.txt
          TOTAL=$(wc -l < /tmp/contents.txt)
          echo "## Cache has $TOTAL store paths"

          # 4. Delete anything not in the keep set
          DOMAIN_DELETED=0
          while read -r path; do
            hash=$(echo "$path" | sed 's#/nix/store/##; s#-# #' | awk '{print $1}')
            if ! grep -qxF "$hash" /tmp/keep.txt; then
              echo "delete $hash ($path)"
              if [ "${DRY_RUN:-true}" != "true" ]; then
                status=$(curl -sSL -o /dev/null -w "%{http_code}" -X DELETE -H "$AUTH" "$API/$hash")
                echo "  -> HTTP $status"
                if [ "$status" != "200" ] && [ "$status" != "204" ]; then
                  DOMAIN_DELETED=1
                fi
              fi
            fi
          done < /tmp/contents.txt

          echo "## Fin!"
          exit $DOMAIN_DELETED
